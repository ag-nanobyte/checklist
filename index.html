<!doctype html>
<html lang="he">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Checklist</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&display=swap">
<!--
  The checklist is in the URL fragment (after #): raw-deflated, base64url JSON
  {"v":1,"t":title,"d":subtitle,"s":[[section,[items]]]}, written by
  monitor/checklist.py. The fragment never reaches the server. Ticks and added
  items stay in this browser's localStorage.
-->
<style>
:root {
  color-scheme: light;
  --bg: #f3f6f2;
  --surface: #ffffff;
  --ink: #17231b;
  --muted: #5f6f64;
  --rule: #dbe4dc;
  --accent: #2f7a45;
  --accent-soft: #e2f0e5;
  --done: #8a988e;
  --danger: #a63d2a;
  --font: "Rubik", system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans Hebrew", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg: #101612;
    --surface: #18211b;
    --ink: #e3ece5;
    --muted: #9aaba0;
    --rule: #2a372e;
    --accent: #6cc487;
    --accent-soft: #1d3324;
    --done: #6d7c72;
    --danger: #ef8a73;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  font-size: 17px;
  line-height: 1.45;
  padding: env(safe-area-inset-top, 0px) 16px calc(40px + env(safe-area-inset-bottom, 0px));
}
.wrap { max-width: 560px; margin: 0 auto; }

header { padding-block: 24px 14px; }
h1 { font-size: 26px; line-height: 1.2; margin: 0; font-weight: 700; text-wrap: balance; }
.sub { color: var(--muted); margin-top: 4px; font-size: 15px; }

.progress {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 2;
  background: var(--bg);
  padding-block: 10px;
  display: grid; gap: 6px;
}
.progress-row { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; font-size: 14px; color: var(--muted); }
.progress-row strong { color: var(--ink); font-variant-numeric: tabular-nums; font-size: 15px; }
.bar { height: 6px; border-radius: 99px; background: var(--rule); overflow: hidden; }
.bar > div { height: 100%; width: 0; background: var(--accent); border-radius: 99px; transition: width .25s ease; }
.all-done .bar > div { background: var(--accent); }

section { margin-top: 18px; }
h2 {
  font-size: 13px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase;
  color: var(--muted); margin: 0 4px 8px;
  display: flex; justify-content: space-between; gap: 8px;
}
h2 .count { font-variant-numeric: tabular-nums; font-weight: 500; letter-spacing: 0; }
ul { list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1px solid var(--rule); border-radius: 14px; overflow: hidden; }
li + li { border-top: 1px solid var(--rule); }
label.item {
  display: flex; align-items: flex-start; gap: 14px;
  padding: 14px 16px; min-height: 52px; cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
label.item:active { background: var(--accent-soft); }
input[type="checkbox"] {
  appearance: none; -webkit-appearance: none; margin: 1px 0 0; flex: none;
  width: 24px; height: 24px; border-radius: 7px; border: 2px solid var(--muted);
  display: grid; place-items: center; background: transparent; cursor: pointer;
}
input[type="checkbox"]::after { content: ""; width: 12px; height: 7px; border: solid transparent; border-width: 0 0 2.5px 2.5px; transform: translateY(-1px) rotate(-45deg); }
input[type="checkbox"]:checked { background: var(--accent); border-color: var(--accent); }
input[type="checkbox"]:checked::after { border-color: var(--surface); }
input[type="checkbox"]:focus-visible { outline: 3px solid var(--accent-soft); outline-offset: 2px; }
.text { flex: 1; overflow-wrap: anywhere; }
li.done .text { color: var(--done); text-decoration: line-through; text-decoration-thickness: 1px; }
.mine { font-size: 12px; color: var(--muted); margin-inline-start: 6px; }
.remove { flex: none; border: 0; background: none; color: var(--muted); font: inherit; font-size: 20px; line-height: 1; padding: 2px 4px; cursor: pointer; }

form.add { display: flex; gap: 8px; margin-top: 22px; }
form.add input {
  flex: 1; min-width: 0; font: inherit; color: var(--ink);
  background: var(--surface); border: 1px solid var(--rule); border-radius: 12px; padding: 12px 14px;
}
form.add input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
button.primary, button.ghost {
  font: inherit; font-size: 15px; font-weight: 600; border-radius: 12px; padding: 12px 16px; cursor: pointer;
}
button.primary { background: var(--accent); color: var(--surface); border: 0; }
button.ghost { background: none; color: var(--muted); border: 1px solid var(--rule); }
.tools { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
.confirm { color: var(--danger); border-color: var(--danger) !important; }
.note { color: var(--muted); font-size: 13px; margin-top: 22px; }
.error { background: var(--surface); border: 1px solid var(--rule); border-radius: 14px; padding: 20px; margin-top: 32px; }
[hidden] { display: none !important; }
@media (prefers-reduced-motion: reduce) { .bar > div { transition: none; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="title" dir="auto">Checklist</h1>
    <div class="sub" id="subtitle" dir="auto" hidden></div>
  </header>

  <div class="progress" id="progress" hidden>
    <div class="progress-row"><span id="progress-label"></span><strong id="progress-count"></strong></div>
    <div class="bar"><div id="bar"></div></div>
  </div>

  <main id="list"></main>

  <div id="controls" hidden>
    <form class="add" id="add-form">
      <input id="add-input" type="text" autocomplete="off" dir="auto">
      <button class="primary" type="submit" id="add-button"></button>
    </form>
    <div class="tools">
      <button class="ghost" type="button" id="hide-done"></button>
      <button class="ghost" type="button" id="reset"></button>
    </div>
    <p class="note" id="note"></p>
  </div>

  <div class="error" id="error" hidden></div>
</div>

<script>
(function () {
  "use strict";
  var fragment = location.hash.slice(1);
  var HEBREW = /[֐-׿]/;

  // Interface strings in the checklist's own language (Hebrew or English).
  var T = {
    en: { progress: "Ticked", add: "Add", addPlaceholder: "Add your own item", mine: "added", hide: "Hide ticked",
          show: "Show ticked", reset: "Untick all", confirm: "Tap again to untick all", allDone: "All done",
          note: "Ticks are saved on this device only.", error: "This link doesn't contain a checklist. Open it from the calendar event or the Telegram message.",
          broken: "This checklist link is damaged or incomplete. Open it again from the calendar event or the Telegram message.", own: "My items" },
    he: { progress: "סומנו", add: "הוספה", addPlaceholder: "הוספת פריט משלך", mine: "נוסף", hide: "הסתרת מסומנים",
          show: "הצגת מסומנים", reset: "ניקוי סימונים", confirm: "לחיצה נוספת לניקוי הכל", allDone: "הכל מוכן",
          note: "הסימונים נשמרים במכשיר הזה בלבד.", error: "הקישור לא מכיל רשימה. יש לפתוח אותו מהאירוע ביומן או מההודעה בטלגרם.",
          broken: "הקישור לרשימה פגום או חלקי. יש לפתוח אותו שוב מהאירוע ביומן או מההודעה בטלגרם.", own: "הפריטים שלי" }
  };

  function hash(str) {            // FNV-1a: a stable storage key per checklist
    var h = 0x811c9dc5;
    for (var i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 0x01000193); }
    return (h >>> 0).toString(36);
  }
  var KEY = "checklist:" + hash(fragment);
  function load() { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return {}; } }
  function save(state) { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }

  function fromBase64url(s) {
    s = s.replace(/-/g, "+").replace(/_/g, "/");
    while (s.length % 4) s += "=";
    var bin = atob(s), bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return bytes;
  }
  function inflate(bytes) {
    var stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
    return new Response(stream).text();
  }

  function showError(t, which) {
    document.getElementById("error").textContent = t[which];
    document.getElementById("error").hidden = false;
  }

  if (!fragment) { showError(T.en, "error"); return; }

  var bytes;
  try { bytes = fromBase64url(decodeURIComponent(fragment)); } catch (e) { showError(T.en, "broken"); return; }
  inflate(bytes).then(JSON.parse).then(render, function () { showError(T.en, "broken"); });

  function render(data) {
    var rtl = HEBREW.test(data.t + JSON.stringify(data.s));
    var t = rtl ? T.he : T.en;
    document.documentElement.lang = rtl ? "he" : "en";
    document.documentElement.dir = rtl ? "rtl" : "ltr";
    document.title = data.t;
    document.getElementById("title").textContent = data.t;
    if (data.d) {
      var sub = document.getElementById("subtitle");
      sub.textContent = data.d; sub.hidden = false;
    }

    var state = load();
    state.ticked = state.ticked || {};
    state.mine = state.mine || [];
    var hideDone = !!state.hideDone;
    var confirming = false;

    var list = document.getElementById("list");
    var progress = document.getElementById("progress");
    var controls = document.getElementById("controls");
    progress.hidden = false; controls.hidden = false;
    document.getElementById("progress-label").textContent = t.progress;
    document.getElementById("add-input").placeholder = t.addPlaceholder;
    document.getElementById("add-button").textContent = t.add;
    document.getElementById("note").textContent = t.note;
    var hideBtn = document.getElementById("hide-done");
    var resetBtn = document.getElementById("reset");

    function sections() {
      var all = (data.s || []).map(function (sec, si) {
        return { name: sec[0], items: sec[1].map(function (text, ii) { return { id: si + ":" + ii, text: text }; }) };
      });
      if (state.mine.length) {
        all.push({ name: t.own, items: state.mine.map(function (m) { return { id: "m:" + m.id, text: m.text, mine: m.id }; }) });
      }
      return all;
    }

    function draw() {
      list.textContent = "";
      var total = 0, done = 0;
      sections().forEach(function (sec) {
        var secDone = sec.items.filter(function (it) { return state.ticked[it.id]; }).length;
        total += sec.items.length; done += secDone;
        var section = document.createElement("section");
        var h2 = document.createElement("h2");
        var name = document.createElement("span"); name.dir = "auto"; name.textContent = sec.name;
        var count = document.createElement("span"); count.className = "count"; count.textContent = secDone + "/" + sec.items.length;
        h2.append(name, count);
        var ul = document.createElement("ul");
        sec.items.forEach(function (it) {
          var ticked = !!state.ticked[it.id];
          if (ticked && hideDone) return;
          var li = document.createElement("li"); if (ticked) li.className = "done";
          var label = document.createElement("label"); label.className = "item";
          var box = document.createElement("input"); box.type = "checkbox"; box.checked = ticked;
          box.addEventListener("change", function () {
            if (box.checked) state.ticked[it.id] = 1; else delete state.ticked[it.id];
            save(state); draw();
          });
          var text = document.createElement("span"); text.className = "text"; text.dir = "auto"; text.textContent = it.text;
          label.append(box, text);
          if (it.mine) {
            var rm = document.createElement("button"); rm.type = "button"; rm.className = "remove";
            rm.setAttribute("aria-label", "remove"); rm.textContent = "×";
            rm.addEventListener("click", function (ev) {
              ev.preventDefault();
              state.mine = state.mine.filter(function (m) { return m.id !== it.mine; });
              delete state.ticked[it.id]; save(state); draw();
            });
            label.append(rm);
          }
          li.append(label); ul.append(li);
        });
        section.append(h2);
        if (ul.children.length) section.append(ul);
        list.append(section);
      });
      document.getElementById("progress-count").textContent = total && done === total ? t.allDone + " · " + done + "/" + total : done + "/" + total;
      document.getElementById("bar").style.width = total ? (100 * done / total) + "%" : "0";
      progress.classList.toggle("all-done", total > 0 && done === total);
      hideBtn.textContent = hideDone ? t.show : t.hide;
      resetBtn.textContent = confirming ? t.confirm : t.reset;
      resetBtn.classList.toggle("confirm", confirming);
    }

    hideBtn.addEventListener("click", function () { hideDone = !hideDone; state.hideDone = hideDone; save(state); draw(); });
    resetBtn.addEventListener("click", function () {
      if (!confirming) { confirming = true; draw(); setTimeout(function () { confirming = false; draw(); }, 4000); return; }
      confirming = false; state.ticked = {}; save(state); draw();
    });
    document.getElementById("add-form").addEventListener("submit", function (ev) {
      ev.preventDefault();
      var input = document.getElementById("add-input");
      var text = input.value.trim();
      if (!text) return;
      state.mine.push({ id: Date.now().toString(36), text: text });
      input.value = ""; save(state); draw();
    });
    draw();
  }
})();
</script>
</body>
</html>
